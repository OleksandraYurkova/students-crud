<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список студентів</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">Ласкаво просимо до списку студентів!</h2>
            <p class="mb-0" th:text="'Привіт, ' + ${user.username} + '!'"></p>
        </div>
        <a href="/logout" class="btn btn-danger">Вийти</a>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Create new student -->
    <div class="card mb-4">
        <div class="card-header">Створити нового студента</div>
        <div class="card-body">
            <form th:action="@{/students}" th:object="${newStudent}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Ім'я:</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="age" class="form-label">Вік:</label>
                    <input type="number" id="age" th:field="*{age}" class="form-control" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Створити студента</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Student list -->
    <div>
        <h3>Список студентів</h3>
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center"
                th:each="student : ${students}">
                <span th:text="'ID: ' + ${student.id} + ' - ' + ${student.name} + ' - ' + ${student.age}">Студент</span>
                <div>
                    <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning btn-sm me-2">Редагувати</a>
                    <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Ви дійсно хочете видалити студента?');">Видалити</a>
                </div>
            </li>
        </ul>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
