<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
   
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">List of Students</h2>

    <!-- Add New Student -->
    <h3>Add New Student</h3>
    <form th:action="@{/students/add}" th:object="${newStudent}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter student's name" required>
            <div th:if="${#fields.hasErrors('name')}" class="text-danger mt-1">
                <span th:errors="*{name}">Name Error</span>
            </div>
        </div>
        <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="number" id="age" th:field="*{age}" class="form-control" placeholder="Enter student's age" required>
            <div th:if="${#fields.hasErrors('age')}" class="text-danger mt-1">
                <span th:errors="*{age}">Age Error</span>
            </div>
        </div>
        <button type="submit" class="btn btn-primary mb-4">Add Student</button>
    </form>

    <hr>

    <!-- Students List -->
    <h3 class="mt-4">Students</h3>
    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th style="width: 160px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.name}">Student Name</td>
            <td th:text="${student.age}">Student Age</td>
            <td>
                <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning btn-sm me-2">Edit</a>
                <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
